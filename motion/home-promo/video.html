<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Циан · мобильная главная</title>
  <script src="plan.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f7fc; font-family: Arial, Helvetica, sans-serif; }
    #frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(circle at 90% 5%, #fff2df 0, transparent 28%), radial-gradient(circle at 5% 76%, #e1ecff 0, transparent 32%), #f5f7fc; }
    #halo, #halo::after { position: absolute; width: 660px; height: 660px; border-radius: 50%; pointer-events: none; content: ''; }
    #halo { top: -292px; right: -250px; background: radial-gradient(circle, rgba(255, 115, 0, .20), rgba(255, 115, 0, 0) 68%); filter: blur(2px); }
    #halo::after { left: -760px; top: 1430px; background: radial-gradient(circle, rgba(62, 128, 255, .18), rgba(62, 128, 255, 0) 70%); }
    .screen { position: absolute; inset: 0; width: 860px; height: 1864px; left: 110px; top: 28px; transform-origin: 50% 50%; opacity: 0; filter: drop-shadow(0 30px 58px rgba(29, 56, 107, .18)); will-change: transform, opacity; }
    .screen img { display: block; width: 100%; height: 100%; border-radius: 34px; }
    .screen::after { position: absolute; inset: 0; border: 1px solid rgba(255, 255, 255, .82); border-radius: 34px; box-shadow: inset 0 0 0 1px rgba(21, 66, 143, .04); content: ''; pointer-events: none; }
    .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16, 35, 81, .26), transparent 25%, transparent 64%, rgba(16, 35, 81, .72)); opacity: .12; pointer-events: none; }
    #caption { position: absolute; left: 54px; right: 54px; bottom: 84px; color: #fff; font-size: 57px; line-height: 1.02; font-weight: 800; letter-spacing: -2px; text-shadow: 0 3px 18px rgba(11, 24, 51, .3); opacity: 0; }
    #caption span { display: inline; background: linear-gradient(135deg, #102a62, #163d86); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 9px 18px 13px; border-radius: 16px; box-shadow: 0 16px 32px rgba(12, 35, 91, .30); }
    #eyebrow { position: absolute; left: 54px; top: 52px; color: #174591; background: rgba(255, 255, 255, .94); border: 1px solid rgba(51, 109, 211, .10); border-radius: 999px; padding: 13px 22px; font-size: 24px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; box-shadow: 0 14px 32px rgba(19, 42, 94, .14); opacity: 0; }
    #cursor { position: absolute; width: 56px; height: 70px; left: -100px; top: -100px; z-index: 4; filter: drop-shadow(0 5px 7px rgba(0,0,0,.32)); }
    #cursor path { fill: white; stroke: #172a57; stroke-width: 4; stroke-linejoin: round; }
    #pulse { position: absolute; width: 86px; height: 86px; border: 5px solid #ff7900; border-radius: 50%; box-shadow: 0 0 0 12px rgba(255, 121, 0, .12); transform: translate(-50%, -50%) scale(0); opacity: 0; z-index: 3; }
    #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle at 50% 48%, rgba(255, 160, 63, .38), rgba(255, 115, 0, .08) 23%, transparent 54%); mix-blend-mode: screen; }
    #end { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 62px 164px; background: linear-gradient(180deg, transparent 22%, rgba(9, 25, 61, .88) 100%); color: #fff; opacity: 0; }
    #end b { color: #ff7900; font-size: 38px; letter-spacing: -1px; margin-bottom: 18px; }
    #end h1 { margin: 0; font-size: 76px; line-height: .94; letter-spacing: -3px; max-width: 850px; text-shadow: 0 14px 42px rgba(0, 0, 0, .22); }
    #end p { margin: 24px 0 0; font-size: 34px; line-height: 1.2; color: #e9eefb; }
  </style>
</head>
<body>
  <div id="frame">
    <div class="screen" id="home"><img src="assets/home.png" alt="Главная"></div>
    <div class="screen" id="saved"><img src="assets/saved-search.png" alt="Сохранённый поиск"></div>
    <div class="screen" id="buy"><img src="assets/buy.png" alt="Вертикаль Купить"></div>
    <div class="screen" id="search"><img src="assets/search.png" alt="Поисковая панель"></div>
    <div class="screen" id="recs"><img src="assets/recommendations.png" alt="Рекомендации"></div>
    <div class="screen" id="feed"><img src="assets/feed.png" alt="Лента с квартирами и сервисами"></div>
    <div id="halo"></div>
    <div class="veil"></div>
    <div id="eyebrow"></div>
    <div id="caption"><span></span></div>
    <div id="pulse"></div>
    <div id="flash"></div>
    <svg id="cursor" viewBox="0 0 64 80" aria-hidden="true"><path d="M8 4 53 43 35 46 27 69z"/></svg>
    <div id="end"><b>циан</b><h1>Ищите.<br>Сохраняйте.<br>Возвращайтесь.</h1><p>Главная, которая ведёт к нужному жилью.</p></div>
  </div>
  <script>
    window.DURATION = window.PLAN.duration;
    window.FPS = window.PLAN.fps;
    const el = Object.fromEntries(['home', 'saved', 'buy', 'search', 'recs', 'feed', 'caption', 'eyebrow', 'cursor', 'pulse', 'flash', 'end'].map(id => [id, document.getElementById(id)]));
    const clamp = value => Math.max(0, Math.min(1, value));
    const ease = value => { value = clamp(value); return value * value * (3 - 2 * value); };
    const span = (time, start, end) => ease((time - start) / (end - start));
    const fade = (time, start, end) => Math.min(span(time, start, start + .35), 1 - span(time, end - .35, end));
    const setScreen = (node, opacity, scale = 1, x = 0, y = 0) => {
      node.style.opacity = opacity.toFixed(3);
      node.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    };
    const cursor = (x, y, opacity) => {
      el.cursor.style.left = `${x}px`; el.cursor.style.top = `${y}px`; el.cursor.style.opacity = opacity;
    };
    const caption = (text, label, opacity) => {
      el.caption.querySelector('span').textContent = text;
      el.caption.style.opacity = opacity;
      el.eyebrow.textContent = label;
      el.eyebrow.style.opacity = opacity;
    };
    const pulse = (time, at, x, y) => {
      const progress = clamp((time - at) / .48);
      el.pulse.style.left = `${x}px`; el.pulse.style.top = `${y}px`;
      el.pulse.style.opacity = progress < 1 ? (1 - progress).toFixed(2) : 0;
      el.pulse.style.transform = `translate(-50%, -50%) scale(${.35 + progress * 1.25})`;
    };
    window.render = time => {
      const active = (start, end) => time >= start && time < end ? 1 : 0;
      const homeOpacity = active(0, 1.75) || active(6.5, 7.5) ? 1 : 0;
      setScreen(el.home, homeOpacity, 1.02 + .03 * span(time, 0, 2.25));
      setScreen(el.saved, active(1.75, 3.75), 1.02 + .04 * span(time, 1.75, 3.75));
      setScreen(el.buy, active(3.75, 6.5), 1.02 + .05 * span(time, 3.75, 6.5));
      setScreen(el.search, active(7.5, 10.25), 1.02 + .04 * span(time, 7.5, 10.25));
      setScreen(el.recs, active(10.25, 12.35), 1.025 + .045 * span(time, 10.25, 12.35), 0, -18 * span(time, 10.25, 12.35));
      setScreen(el.feed, active(12.35, 13.5), 1.16 + .10 * span(time, 12.35, 13.5), 0, -210 - 62 * span(time, 12.35, 13.5));
      el.flash.style.opacity = (active(12.23, 12.65) ? (1 - span(time, 12.23, 12.65)) * .72 : 0).toFixed(3);
      el.end.style.opacity = span(time, 13.45, 14.0).toFixed(3);
      let text = 'Поиск — на первом экране', label = 'Новая главная', visible = fade(time, 0, 1.75);
      if (time >= 1.75 && time < 3.75) { text = 'Продолжайте с сохранённого поиска'; label = 'Вернулись к поиску'; visible = fade(time, 1.75, 3.75); }
      if (time >= 3.75 && time < 6.5) { text = 'Выберите нужное направление'; label = 'Пять вертикалей'; visible = fade(time, 3.75, 6.5); }
      if (time >= 7.5 && time < 10.25) { text = 'Уточняйте район, метро или ЖК'; label = 'Быстрый поиск'; visible = fade(time, 7.5, 10.25); }
      if (time >= 10.25 && time < 12.35) { text = 'Рекомендации уже ждут вас'; label = 'Для вас'; visible = fade(time, 10.25, 12.35); }
      if (time >= 12.35 && time < 13.5) { text = 'Квартиры, которые хочется открыть'; label = 'Проверено Циан'; visible = fade(time, 12.35, 13.5); }
      caption(text, label, visible);
      cursor(-100, -100, 0);
      el.pulse.style.opacity = 0;
      if (time >= .7 && time < 1.8) { const p = span(time, .7, 1.5); cursor(357 - 58 * p, 815 - 44 * p, 1); pulse(time, 1.5, 298, 771); }
      if (time >= 2.7 && time < 3.8) { const p = span(time, 2.7, 3.5); cursor(522 - 240 * p, 1250 - 125 * p, 1); pulse(time, 3.5, 280, 1127); }
      if (time >= 6.45 && time < 7.55) { const p = span(time, 6.45, 7.25); cursor(702 - 250 * p, 670 - 165 * p, 1); pulse(time, 7.25, 452, 505); }
      if (time >= 9.6 && time < 10.7) { const p = span(time, 9.6, 10.25); cursor(678 - 260 * p, 1265 - 340 * p, 1); pulse(time, 10.25, 418, 929); }
      if (time >= 11.55 && time < 12.48) { const p = span(time, 11.55, 12.2); cursor(810 - 318 * p, 1515 - 387 * p, 1); pulse(time, 12.2, 492, 1128); }
    };
    window.READY = true;
  </script>
</body>
</html>
